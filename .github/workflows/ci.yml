name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test (all)
        run: cargo test --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build wasm crate (skeleton)
        run: |
          cargo build -p cad2robot-wasm --target wasm32-unknown-unknown
          # In PR2+ we will do: wasm-pack build crates/wasm --target web

  # Future: playwright / vitest jobs for the web app
