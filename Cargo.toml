[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CAD2Robot contributors"]
license = "Apache-2.0"
repository = "https://github.com/your-org/cad2robot" # TODO: update when real repo exists

[workspace.dependencies]
# Geometry kernel (occt-wasm primary per design; provides STEP import, volume/CoM/inertia, tessellation)
# occt-wasm is the recommended primary kernel (see design doc).
# Version declared for workspace; members set optional = true when using the feature.
occt-wasm = "3"

# URDF (parser for roundtrip validation; emitter owned in core for Isaac control)
urdf-rs = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Serialization for model snapshots (used by WASM + save/load)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Common
thiserror = "1"
nalgebra = "0.32"  # for poses, inertia math (will be used heavily later)

# Dev / test
proptest = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true

# WASM specific profile hints (PR2+)
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
